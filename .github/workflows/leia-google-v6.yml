name: Build Ok Leia v6 with Google Assistant preserved

on:
  push:
    branches: [ "leia-google-v6" ]
    paths:
      - ".github/workflows/leia-google-v6.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Clone wake engine
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/suddenBook/GPTWake.git LeiaWake
          cd LeiaWake
          git checkout 2e31652be39b1751a6a75eac3027716b7d5286b1

      - name: Customize for Ok Leia + keep Google assistant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("LeiaWake")

          # Unique app id/version.
          p = root / "app/build.gradle.kts"
          s = p.read_text()
          s = s.replace('applicationId = "com.desmond.gptwake"', 'applicationId = "md.leia.parallel"')
          s = s.replace('versionCode = 3', 'versionCode = 600')
          s = s.replace('versionName = "1.1.0"', 'versionName = "6.0"')

          # No Japanese ASR download; only the bundled keyword spotter is needed.
          old = '''androidComponents.onVariants { variant ->
              variant.sources.assets?.addGeneratedSourceDirectory(prepareJapaneseModels,
                  PrepareJapaneseModels::outputDirectory)
          }'''
          s = s.replace(old, '')
          p.write_text(s)

          # Default wake phrase: Russian "Ок, Лея" approximated with model phonemes.
          p = root / "app/src/main/java/com/desmond/gptwake/WakeWordStore.java"
          s = p.read_text()
          s = s.replace('public static final String DEFAULT_PHRASE = "芝麻开门";',
                        'public static final String DEFAULT_PHRASE = "Ок Лея";')
          s = s.replace('public static final String DEFAULT_LINE = "zh ī m á k āi m én @芝麻开门";',
                        'public static final String DEFAULT_LINE = "OW1 K L EH1 Y AH0 @Ок_Лея";')
          p.write_text(s)

          p = root / "app/src/main/java/com/desmond/gptwake/KwsEngine.java"
          s = p.read_text().replace('public static final float DEFAULT_THRESHOLD = 0.40f;',
                                  'public static final float DEFAULT_THRESHOLD = 0.32f;')
          p.write_text(s)

          # Let Google/Gemini remain the system assistant. Do not gate setup on ChatGPT role.
          p = root / "app/src/main/java/com/desmond/gptwake/ui/WakeUiState.kt"
          s = p.read_text()
          old = '''    // ChatGPT must hold the assistant role or it cannot record under keyguard. This app must never
    // take that role for itself.
    assistant = Settings.Secure.getString(context.contentResolver, "voice_interaction_service")
        ?.let(android.content.ComponentName::unflattenFromString)
        ?.packageName == "com.openai.chatgpt",
'''
          new = '''    // Google/Gemini stays the system assistant so "Hey Google" keeps working.
    // Ok Leia uses its own foreground wake-word engine and waits for unlock before ChatGPT Voice.
    assistant = true,
'''
          if old not in s:
              raise SystemExit("assistant permission block not found")
          s = s.replace(old, new)
          p.write_text(s)

          # Add a wake/lock relay activity and a scoped accessibility service for the Voice button.
          unlock_java = r'''package com.desmond.gptwake;

import android.app.Activity;
import android.app.KeyguardManager;
import android.content.BroadcastReceiver;
import android.content.Context;
import android.content.Intent;
import android.content.IntentFilter;
import android.os.Build;
import android.os.Bundle;
import android.view.Gravity;
import android.view.WindowManager;
import android.widget.TextView;

public class UnlockRelayActivity extends Activity {
    private boolean sent;
    private BroadcastReceiver receiver;

    @Override
    protected void onCreate(Bundle state) {
        super.onCreate(state);
        setShowWhenLocked(true);
        setTurnScreenOn(true);
        getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

        TextView text = new TextView(this);
        text.setText("Ок, Лея услышала\n\nРазблокируй телефон — ChatGPT Voice запустится автоматически");
        text.setTextSize(22f);
        text.setGravity(Gravity.CENTER);
        int pad = (int)(28 * getResources().getDisplayMetrics().density);
        text.setPadding(pad, pad, pad, pad);
        setContentView(text);

        receiver = new BroadcastReceiver() {
            @Override public void onReceive(Context context, Intent intent) {
                if (Intent.ACTION_USER_PRESENT.equals(intent.getAction())) continueAfterUnlock();
            }
        };
        IntentFilter filter = new IntentFilter(Intent.ACTION_USER_PRESENT);
        if (Build.VERSION.SDK_INT >= 33) {
            registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED);
        } else {
            registerReceiver(receiver, filter);
        }

        KeyguardManager km = getSystemService(KeyguardManager.class);
        if (km != null) {
            try {
                km.requestDismissKeyguard(this, new KeyguardManager.KeyguardDismissCallback() {
                    @Override public void onDismissSucceeded() {
                        continueAfterUnlock();
                    }
                });
            } catch (Throwable ignored) {}
        }
    }

    @Override
    protected void onResume() {
        super.onResume();
        KeyguardManager km = getSystemService(KeyguardManager.class);
        if (km == null || !km.isDeviceLocked()) continueAfterUnlock();
    }

    private void continueAfterUnlock() {
        if (sent) return;
        sent = true;
        WakeController c = WakeService.controller();
        if (c != null) c.continueAfterUnlock();
        finish();
    }

    @Override
    protected void onDestroy() {
        if (receiver != null) {
            try { unregisterReceiver(receiver); } catch (Throwable ignored) {}
        }
        super.onDestroy();
    }
}
'''
          (root / "app/src/main/java/com/desmond/gptwake/UnlockRelayActivity.java").write_text(unlock_java)

          click_java = r'''package com.desmond.gptwake;

import android.accessibilityservice.AccessibilityService;
import android.accessibilityservice.GestureDescription;
import android.content.Context;
import android.graphics.Path;
import android.graphics.Rect;
import android.os.Handler;
import android.os.Looper;
import android.view.accessibility.AccessibilityEvent;
import android.view.accessibility.AccessibilityNodeInfo;

import java.util.Locale;

public class VoiceClickService extends AccessibilityService {
    private static final String PREFS = "voice_click";
    private static final String KEY_UNTIL = "pending_until";
    private static final String CHATGPT = "com.openai.chatgpt";
    private final Handler handler = new Handler(Looper.getMainLooper());
    private int attempts;

    public static void arm(Context c) {
        c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                .edit().putLong(KEY_UNTIL, System.currentTimeMillis() + 15000L).apply();
    }

    private boolean pending() {
        return System.currentTimeMillis() <
                getSharedPreferences(PREFS, MODE_PRIVATE).getLong(KEY_UNTIL, 0L);
    }

    private void clear() {
        getSharedPreferences(PREFS, MODE_PRIVATE).edit().remove(KEY_UNTIL).apply();
        attempts = 0;
    }

    @Override public void onAccessibilityEvent(AccessibilityEvent event) {
        if (event == null || event.getPackageName() == null) return;
        if (!CHATGPT.contentEquals(event.getPackageName()) || !pending()) return;
        handler.removeCallbacksAndMessages(null);
        handler.postDelayed(this::attempt, 450);
    }

    @Override public void onInterrupt() {
        handler.removeCallbacksAndMessages(null);
    }

    private void attempt() {
        if (!pending()) return;
        AccessibilityNodeInfo root = getRootInActiveWindow();
        if (root == null) { retry(); return; }

        Rect screen = new Rect();
        root.getBoundsInScreen(screen);

        Candidate best = new Candidate();
        scan(root, screen, best);
        if (best.node != null && best.score >= 60 && click(best.node)) {
            clear();
            return;
        }

        Candidate br = new Candidate();
        findBottomRight(root, screen, br);
        if (attempts >= 2 && br.node != null && click(br.node)) {
            clear();
            return;
        }

        if (attempts >= 4 && screen.width() > 0 && screen.height() > 0) {
            float x = screen.left + screen.width() * 0.91f;
            float y = screen.top + screen.height() * 0.88f;
            tap(x, y);
            clear();
            return;
        }
        retry();
    }

    private void retry() {
        attempts++;
        if (attempts <= 7 && pending()) handler.postDelayed(this::attempt, attempts < 3 ? 500 : 800);
    }

    private void scan(AccessibilityNodeInfo node, Rect screen, Candidate best) {
        if (node == null) return;
        String all = (norm(node.getText()) + " " + norm(node.getContentDescription()) + " " +
                norm(node.getViewIdResourceName())).trim();

        int score = 0;
        if (contains(all, "voice mode", "start voice", "voice conversation",
                "голосовой режим", "голосовой разговор", "начать голос",
                "voice_mode", "voicebutton", "voice_button")) score += 120;
        else {
            if (all.contains("voice")) score += 75;
            if (all.contains("голос")) score += 75;
        }
        if (contains(all, "microphone", "dictation", "микрофон", "диктов", "голосовой ввод")) score -= 100;
        if (node.isClickable()) score += 18;
        if (node.isEnabled()) score += 5;

        Rect r = new Rect();
        node.getBoundsInScreen(r);
        if (!r.isEmpty() && screen.width() > 0 && screen.height() > 0) {
            if (r.exactCenterX() > screen.left + screen.width() * 0.68f) score += 15;
            if (r.exactCenterY() > screen.top + screen.height() * 0.68f) score += 15;
        }
        if (score > best.score) { best.score = score; best.node = node; }
        for (int i=0;i<node.getChildCount();i++) scan(node.getChild(i), screen, best);
    }

    private void findBottomRight(AccessibilityNodeInfo node, Rect screen, Candidate best) {
        if (node == null || screen.width() <= 0 || screen.height() <= 0) return;
        Rect r = new Rect();
        node.getBoundsInScreen(r);
        if (node.isClickable() && node.isEnabled() && !r.isEmpty()) {
            float cx=r.exactCenterX(), cy=r.exactCenterY();
            if (cx > screen.left + screen.width()*0.68f && cy > screen.top + screen.height()*0.70f) {
                String all=(norm(node.getText())+" "+norm(node.getContentDescription())+" "+norm(node.getViewIdResourceName())).trim();
                if (!contains(all,"send","отправ","microphone","микрофон","dictat","диктов","attach","прикреп","keyboard","клавиат")) {
                    long area=(long)r.width()*r.height();
                    long sa=(long)screen.width()*screen.height();
                    if (area>0 && area<sa/12) {
                        int score=(int)(cx*10+cy);
                        if (score>best.score) { best.score=score; best.node=node; }
                    }
                }
            }
        }
        for(int i=0;i<node.getChildCount();i++) findBottomRight(node.getChild(i),screen,best);
    }

    private boolean click(AccessibilityNodeInfo node) {
        AccessibilityNodeInfo cur=node;
        for(int i=0;i<5 && cur!=null;i++) {
            if(cur.isClickable() && cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true;
            cur=cur.getParent();
        }
        Rect r=new Rect();
        node.getBoundsInScreen(r);
        return !r.isEmpty() && tap(r.exactCenterX(),r.exactCenterY());
    }

    private boolean tap(float x,float y) {
        Path p=new Path(); p.moveTo(x,y);
        GestureDescription g=new GestureDescription.Builder()
                .addStroke(new GestureDescription.StrokeDescription(p,0,80)).build();
        return dispatchGesture(g,null,null);
    }

    private static String norm(CharSequence s) {
        return s==null ? "" : s.toString().toLowerCase(Locale.ROOT).replace('ё','е').trim();
    }
    private static boolean contains(String h,String... ns) {
        for(String n:ns) if(h.contains(n)) return true;
        return false;
    }
    private static class Candidate {
        AccessibilityNodeInfo node;
        int score=Integer.MIN_VALUE;
    }
}
'''
          (root / "app/src/main/java/com/desmond/gptwake/VoiceClickService.java").write_text(click_java)

          # Accessibility configuration.
          xml_dir = root / "app/src/main/res/xml"
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / "voice_click_service.xml").write_text('''<?xml version="1.0" encoding="utf-8"?>
<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
    android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked"
    android:accessibilityFeedbackType="feedbackGeneric"
    android:notificationTimeout="100"
    android:canRetrieveWindowContent="true"
    android:canPerformGestures="true"
    android:accessibilityFlags="flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
    android:packageNames="com.openai.chatgpt"
    android:description="@string/voice_click_description" />
''')

          # Patch WakeController: wait for unlock, then arm Voice click and launch ChatGPT.
          p = root / "app/src/main/java/com/desmond/gptwake/WakeController.java"
          s = p.read_text()
          s = s.replace('import android.content.Context;\n',
                        'import android.app.KeyguardManager;\nimport android.content.Context;\nimport android.content.Intent;\n')

          old = '''    private void launchChatGpt() {
        if (state != State.MIC_HANDOFF) return;
        if (hasCommunication()) {
            pauseForCommunication();
            return;
        }
        set(State.CHATGPT_LAUNCHING);
        launchStartedAt = SystemClock.elapsedRealtime();
        deeplinkTried = false;
        L.i("CHATGPT_LAUNCH_ATTEMPT route=AssistantActivity");
        GptLauncher.launchDirect(ctx);
        later(this::checkVoiceConfirm, VOICE_CONFIRM_MS);
    }
'''
          new = '''    private void launchChatGpt() {
        if (state != State.MIC_HANDOFF) return;
        if (hasCommunication()) {
            pauseForCommunication();
            return;
        }
        set(State.CHATGPT_LAUNCHING);
        launchStartedAt = SystemClock.elapsedRealtime();
        deeplinkTried = false;

        KeyguardManager km = ctx.getSystemService(KeyguardManager.class);
        if (km != null && km.isDeviceLocked()) {
            L.i("WAITING_FOR_USER_UNLOCK");
            try {
                ctx.startActivity(new Intent(ctx, UnlockRelayActivity.class)
                        .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                                | Intent.FLAG_ACTIVITY_CLEAR_TOP
                                | Intent.FLAG_ACTIVITY_SINGLE_TOP));
            } catch (Throwable t) {
                L.e("UNLOCK_RELAY_LAUNCH_FAIL", t);
                reacquire();
            }
            return;
        }
        continueAfterUnlock();
    }

    public void continueAfterUnlock() {
        post(() -> {
            if (state != State.CHATGPT_LAUNCHING) return;
            launchStartedAt = SystemClock.elapsedRealtime();
            deeplinkTried = false;
            VoiceClickService.arm(ctx);
            L.i("CHATGPT_LAUNCH_AFTER_UNLOCK route=AssistantActivity");
            boolean direct = GptLauncher.launchDirect(ctx);
            if (!direct) {
                L.i("CHATGPT_DIRECT_UNAVAILABLE falling back immediately");
                deeplinkTried = true;
                GptLauncher.launchDeeplink(ctx);
                later(this::checkVoiceConfirm, DEEPLINK_CONFIRM_MS);
            } else {
                later(this::checkVoiceConfirm, VOICE_CONFIRM_MS);
            }
        });
    }
'''
          if old not in s:
              raise SystemExit("launchChatGpt block not found")
          s = s.replace(old, new)
          p.write_text(s)

          # Manifest: remove optional notification listener and add relay + scoped accessibility.
          p = root / "app/src/main/AndroidManifest.xml"
          s = p.read_text()
          start = s.find('        <!-- Optional: gives the screen-on path a Hang Up action.')
          if start != -1:
              end = s.find('        </service>\n', start)
              if end != -1:
                  end += len('        </service>\n')
                  s = s[:start] + s[end:]

          insert = '''
        <activity
            android:name=".UnlockRelayActivity"
            android:exported="false"
            android:showWhenLocked="true"
            android:turnScreenOn="true"
            android:excludeFromRecents="true"
            android:noHistory="true"
            android:theme="@style/Theme.GPTWake" />

        <service
            android:name=".VoiceClickService"
            android:label="Ок Лея — запуск Voice в ChatGPT"
            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
            android:exported="true">
            <intent-filter>
                <action android:name="android.accessibilityservice.AccessibilityService" />
            </intent-filter>
            <meta-data
                android:name="android.accessibilityservice"
                android:resource="@xml/voice_click_service" />
        </service>
'''
          marker = '        <receiver\n            android:name=".BootReceiver"'
          if marker not in s:
              raise SystemExit("manifest receiver marker not found")
          s = s.replace(marker, insert + '\n' + marker)
          p.write_text(s)

          # Strings.
          p = root / "app/src/main/res/values/strings.xml"
          s = p.read_text()
          replacements = {
              '<string name="app_name">GPTWake</string>':
                  '<string name="app_name">Ок Лея</string>',
              '<string name="tagline">Offline wake word · opens ChatGPT voice</string>':
                  '<string name="tagline">«Ок, Лея» параллельно с «Окей Google»</string>',
              '<string name="notification_listening">GPTWake is listening for the wake word</string>':
                  '<string name="notification_listening">Ок Лея слушает ключевую фразу</string>',
              '<string name="privacy_note">Wake word detection runs entirely on this device; no audio is uploaded</string>':
                  '<string name="privacy_note">«Ок, Лея» распознаётся локально. Google/Gemini остаётся системным помощником.</string>',
              '<string name="perm_assistant">ChatGPT is the system default assistant</string>':
                  '<string name="perm_assistant">Google/Gemini остаётся системным помощником</string>',
              '<string name="perm_assistant_why">Otherwise ChatGPT can\\\'t get the microphone on the lock screen</string>':
                  '<string name="perm_assistant_why">Не меняй системного помощника — «Окей Google» должен продолжать работать</string>',
              '<string name="channel_listening">Wake word listening</string>':
                  '<string name="channel_listening">Ок Лея — фоновое прослушивание</string>',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          s = s.replace('</resources>',
                        '    <string name="voice_click_description">После разблокировки открывает ChatGPT и нажимает кнопку Voice. Работает только с приложением ChatGPT.</string>\n</resources>')
          p.write_text(s)

          # Allow LEIA in phrase editor if it is ever used.
          p = root / "app/src/main/assets/kws/en.phone"
          with p.open("a", encoding="utf-8") as f:
              f.write("\nLEIA L EH1 Y AH0\n")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: LeiaWake
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp LeiaWake/app/build/outputs/apk/debug/app-debug.apk "Ok-Leia-Google-Compatible-v6.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ok-leia-google-compatible-v6
          path: Ok-Leia-Google-Compatible-v6.apk
          if-no-files-found: error
          retention-days: 30
