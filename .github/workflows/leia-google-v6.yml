name: Build Ok Leia v6 with Google Assistant preserved

on:
  push:
    branches: [ "leia-google-v6" ]
    paths:
      - ".github/workflows/leia-google-v6.yml"
      - "leia_v6_patch/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Clone wake engine
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/suddenBook/GPTWake.git LeiaWake
          cd LeiaWake
          git checkout 2e31652be39b1751a6a75eac3027716b7d5286b1

      - name: Apply Ok Leia v6 patch
        shell: bash
        run: python3 leia_v6_patch/patch.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: LeiaWake
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: cp LeiaWake/app/build/outputs/apk/debug/app-debug.apk "Ok-Leia-Google-Compatible-v6.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ok-leia-google-compatible-v6
          path: Ok-Leia-Google-Compatible-v6.apk
          if-no-files-found: error
          retention-days: 30
