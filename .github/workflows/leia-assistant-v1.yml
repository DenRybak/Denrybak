name: Build Leia Assistant v1

on:
  push:
    branches: [ "leia-assistant-v1" ]
    paths:
      - "LeiaAssistant/**"
      - ".github/workflows/leia-assistant-v1.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: LeiaAssistant
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: leia-assistant-v1
          path: LeiaAssistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
